<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TradeLab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070b14;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: auto;
    }

    /* الهيدر */
    header {
      padding: 25px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .badge {
      background: #073f36;
      color: #35d6a0;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
    }

    /* بطاقة الدخول */
    .login-card {
      margin-top: 70px;
      background: #111827;
      border: 1px solid #263249;
      border-radius: 25px;
      padding: 30px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #8d98ad;
      margin-bottom: 30px;
      font-size: 16px;
    }

    label {
      display: block;
      color: #b8c0d0;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 17px;
      margin-bottom: 18px;
      background: #080e1a;
      border: 1px solid #2a3850;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2864ed;
    }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn {
      background: #2864ed;
    }

    .demo-btn {
      background: #07845f;
      margin-top: 12px;
    }

    .note {
      text-align: center;
      color: #68758c;
      font-size: 13px;
      margin-top: 20px;
    }

    /* لوحة الطالب */
    #dashboard {
      display: none;
    }

    .welcome {
      margin-top: 45px;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #8d98ad;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat {
      background: #111827;
      border: 1px solid #263249;
      border-radius: 18px;
      padding: 20px;
    }

    .stat-title {
      color: #8d98ad;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .green {
      color: #35d6a0;
    }

    .blue {
      color: #4f83ff;
    }

    .logout {
      background: #d93636;
      margin-top: 25px;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">TradeLab</div>
      <div class="badge">محاكاة تداول</div>
    </header>

    <!-- صفحة الدخول -->
    <section id="loginPage" class="login-card">

      <h1>تسجيل الدخول</h1>

      <p class="subtitle">
        منصة تداول تعليمية
      </p>

      <label>البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        placeholder="example@email.com"
      >

      <label>كلمة المرور</label>
      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
      >

      <button class="btn login-btn" onclick="login()">
        تسجيل الدخول
      </button>

      <button class="btn demo-btn" onclick="demoLogin()">
        تجربة المنصة
      </button>

      <div class="note">
        تسجيل الدخول الحقيقي سيتم ربطه بقاعدة البيانات لاحقًا
      </div>

    </section>


    <!-- لوحة الطالب -->
    <section id="dashboard">

      <div class="welcome">
        <h2>مرحباً بك 👋</h2>
        <p>هذه لوحة التحكم الخاصة بك</p>
      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-title">الرصيد</div>
          <div id="balance" class="stat-value green">
            $10,000
          </div>
        </div>

        <div class="stat">
          <div class="stat-title">المستوى</div>
          <div id="level" class="stat-value blue">
            1
          </div>
        </div>

        <div class="stat">
          <div class="stat-title">الصفقات</div>
          <div id="trades" class="stat-value">
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-title">الحالة</div>
          <div class="stat-value green">
            نشط
          </div>
        </div>

      </div>

      <button class="btn logout" onclick="logout()">
        تسجيل الخروج
      </button>

    </section>

  </div>


  <script>

    function login() {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
        return;
      }

      showDashboard();
    }


    function demoLogin() {
      showDashboard();
    }


    function showDashboard() {

      document.getElementById("loginPage").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

    }


    function logout() {

      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginPage").style.display = "block";

    }

  </script>

</body>
</html>
