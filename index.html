<script>
const SUPABASE_URL = "ضع_رابط_مشروعك_هنا";
const SUPABASE_ANON_KEY = "ضع_مفتاح_Anon_هنا";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const loginPage = document.getElementById("loginPage");
const dashboardPage = document.getElementById("dashboardPage");

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");


// =====================================
// إظهار / إخفاء الصفحات
// =====================================

function showLogin() {
    if (loginPage) loginPage.style.display = "block";
    if (dashboardPage) dashboardPage.style.display = "none";
}

function showDashboard() {
    if (loginPage) loginPage.style.display = "none";
    if (dashboardPage) dashboardPage.style.display = "block";
}


// =====================================
// التحقق من تسجيل الدخول
// =====================================

async function checkLogin() {

    showLogin();

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();

    if (error) {
        console.error(error);
        showLogin();
        return;
    }

    if (session && session.user) {
        showDashboard();
        await loadProfile(session.user.id);
    } else {
        showLogin();
    }
}


// =====================================
// تسجيل الدخول
// =====================================

if (loginForm) {

    loginForm.addEventListener("submit", async function(e) {

        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            alert("أدخل البريد الإلكتروني وكلمة المرور");
            return;
        }

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            alert("فشل تسجيل الدخول: " + error.message);
            return;
        }

        if (data.session) {
            showDashboard();
            await loadProfile(data.user.id);
        }
    });
}


// =====================================
// مراقبة حالة تسجيل الدخول
// =====================================

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (session && session.user) {

            showDashboard();

            // لا نحمّل البيانات إلا بعد تسجيل الدخول
            if (event !== "INITIAL_SESSION") {
                await loadProfile(session.user.id);
            }

        } else {

            // إذا خرج المستخدم أو لا توجد جلسة
            showLogin();
        }
    }
);


// =====================================
// تحميل بيانات الطالب
// =====================================

async function loadProfile(userId) {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, full_name, role, balance, level, total_trades")
        .eq("id", userId)
        .single();

    if (error) {
        console.error("Profile error:", error);
        return;
    }

    if (!data) {
        return;
    }

    // حماية إضافية
    if (data.role === "admin") {
        console.log("تم تسجيل دخول المدير");
    }

    const nameElement =
        document.getElementById("fullName");

    const balanceElement =
        document.getElementById("balance");

    const levelElement =
        document.getElementById("level");

    const tradesElement =
        document.getElementById("trades");

    if (nameElement)
        nameElement.textContent = data.full_name || "طالب";

    if (balanceElement)
        balanceElement.textContent = data.balance ?? 0;

    if (levelElement)
        levelElement.textContent = data.level ?? 1;

    if (tradesElement)
        tradesElement.textContent = data.total_trades ?? 0;
}


// =====================================
// تسجيل الخروج
// =====================================

async function logout() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("حدث خطأ أثناء تسجيل الخروج");
        console.error(error);
        return;
    }

    showLogin();
}


// =====================================
// تشغيل التحقق عند فتح الموقع
// =====================================

document.addEventListener("DOMContentLoaded", () => {
    checkLogin();
});
                                </script>
