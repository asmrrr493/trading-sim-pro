<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Twer Pro</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      direction: ltr;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn {
      background: #667eea;
      color: white;
    }

    .register-btn {
      background: #f1f1f1;
      color: #333;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 24px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .dashboard {
      text-align: center;
    }

    .info-box {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin: 12px 0;
      text-align: right;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Twer Pro
    </div>

    <div class="card" id="authCard">

      <h2>مرحبًا بك 👋</h2>

      <div class="subtitle">
        سجل دخولك أو أنشئ حسابًا جديدًا
      </div>

      <input
        type="text"
        id="name"
        placeholder="اسم الطالب"
      >

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
      >

      <button
        class="login-btn"
        id="loginBtn">
        تسجيل الدخول
      </button>

      <button
        class="register-btn"
        id="registerBtn">
        إنشاء حساب جديد
      </button>

      <div
        class="message"
        id="message">
      </div>

    </div>

    <div
      class="card dashboard hidden"
      id="dashboard">

      <h2>أهلًا بك 🎓</h2>

      <div class="info-box">
        <strong>الاسم</strong>
        <span id="studentName">---</span>
      </div>

      <div class="info-box">
        <strong>البريد الإلكتروني</strong>
        <span id="studentEmail">---</span>
      </div>

      <div class="info-box">
        <strong>المستوى</strong>
        <span id="studentLevel">---</span>
      </div>

      <div class="info-box">
        <strong>الرصيد</strong>
        <span id="studentBalance">0</span>
      </div>

      <button
        class="logout-btn"
        id="logoutBtn">
        تسجيل الخروج
      </button>

    </div>

  </div>
    <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // إعدادات Firebase الخاصة بـ Twer Pro

    const firebaseConfig = {
      apiKey: "AIzaSyA0kqx7QBWRKYgv-0W2BEkfbI3vqLClfWI",
      authDomain: "twer-pro.firebaseapp.com",
      projectId: "twer-pro",
      storageBucket: "twer-pro.firebasestorage.app",
      messagingSenderId: "454562980143",
      appId: "1:454562980143:web:47610adc655df1976e01da"
    };


    // تشغيل Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // العناصر

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const message = document.getElementById("message");

    const authCard = document.getElementById("authCard");
    const dashboard = document.getElementById("dashboard");

    const studentName = document.getElementById("studentName");
    const studentEmail = document.getElementById("studentEmail");
    const studentLevel = document.getElementById("studentLevel");
    const studentBalance = document.getElementById("studentBalance");


    // رسالة للمستخدم

    function showMessage(text) {
      message.textContent = text;
    }


    // إنشاء حساب

    registerBtn.addEventListener("click", async () => {

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!name || !email || !password) {
        showMessage("يرجى تعبئة جميع الحقول");
        return;
      }

      if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
        return;
      }

      try {

        showMessage("جاري إنشاء الحساب...");

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;


        // حفظ بيانات الطالب في Firestore

        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: email,
            level: "beginner",
            balance: "0",
            role: "student"
          }
        );


        showMessage("تم إنشاء الحساب بنجاح ✅");

      } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {
          showMessage("هذا البريد مستخدم بالفعل");
        }

        else if (error.code === "auth/invalid-email") {
          showMessage("البريد الإلكتروني غير صحيح");
        }

        else if (error.code === "auth/weak-password") {
          showMessage("كلمة المرور ضعيفة");
        }

        else {
          showMessage("حدث خطأ أثناء إنشاء الحساب");
        }

      }

    });


    // تسجيل الدخول

    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("أدخل البريد وكلمة المرور");
        return;
      }

      try {

        showMessage("جاري تسجيل الدخول...");

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage("تم تسجيل الدخول ✅");

      } catch (error) {

        console.log(error);

        showMessage("البريد أو كلمة المرور غير صحيحة");

      }

    });


    // مراقبة حالة تسجيل الدخول

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        try {

          const userDoc = await getDoc(
            doc(db, "users", user.uid)
          );

          if (userDoc.exists()) {

            const data = userDoc.data();

            studentName.textContent =
              data.name || "بدون اسم";

            studentEmail.textContent =
              data.email || user.email;

            studentLevel.textContent =
              data.level || "beginner";

            studentBalance.textContent =
              data.balance || "0";

          }

        } catch (error) {

          console.log(error);

        }

        authCard.classList.add("hidden");

        dashboard.classList.remove("hidden");

      }

      else {

        authCard.classList.remove("hidden");

        dashboard.classList.add("hidden");

      }

    });


    // تسجيل الخروج

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

      showMessage("تم تسجيل الخروج");

    });

  </script>

</body>
</html>
