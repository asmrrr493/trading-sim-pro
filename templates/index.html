<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Nexora Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
       .container { max-width: 1200px; margin: auto; }
       .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
       .balance { font-size: 24px; color: #2ea043; }
       .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-top: 20px; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { background: #238636; cursor: pointer; }
        button.danger { background: #da3633; }
        #chart { height: 400px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> Nexora Pro</h1>
        <div class="balance">الرصيد: $<span id="balance">{{ user.balance | round(2) }}</span></div>
    </div>

    <div class="card">
        <h3>سحب / إيداع</h3>
        <input type="number" id="amount" placeholder="المبلغ">
        <button onclick="deposit()">إيداع</button>
        <button class="danger" onclick="withdraw()">سحب</button>
    </div>

    <div class="card">
        <h3>الشموع اليابانية - BTC</h3>
        <canvas id="chart"></canvas>
    </div>

    <div class="card">
        <h3>التداول</h3>
        <select id="symbol">
            {% for symbol in market %}
            <option value="{{ symbol }}">{{ symbol }} - ${{ market[symbol].price }}</option>
            {% endfor %}
        </select>
        <input type="number" id="tradeAmount" placeholder="الكمية">
        <button onclick="trade('buy')">شراء</button>
        <button class="danger" onclick="trade('sell')">بيع</button>
    </div>

    <div class="card">
        <h3>المحفظة</h3>
        <ul>
            {% for symbol, amount in user.portfolio.items() %}
            <li>{{ symbol }}: {{ amount | round(4) }}</li>
            {% endfor %}
            <li>نقدي: ${{ user.balance | round(2) }}</li>
        </ul>
    </div>
</div>

<script>
const candles = {{ market['BTC']['candles'] | tojson }};
const ctx = document.getElementById('chart');
new Chart(ctx, {
    type: 'candlestick',
    data: { datasets: [{ label: 'BTC', data: candles }] }
});

function api(url, body) {
    fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
   .then(res => res.json()).then(data => {
        if(data.success){ document.getElementById('balance').innerText = data.balance.toFixed(2); location.reload(); }
        else{ alert('رصيد غير كافي') }
    })
}
function trade(type){ api('/trade', {type: type, symbol: document.getElementById('symbol').value, amount: document.getElementById('tradeAmount').value}) }
function deposit(){ api('/deposit', {amount: document.getElementById('amount').value}) }
function withdraw(){ api('/withdraw', {amount: document.getElementById('amount').value}) }
</script>
</body>
</html>
