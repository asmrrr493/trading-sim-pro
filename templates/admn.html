<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><title>اكواد اليوم</title>
<style>
body{background:#0a0a0a;color:#fff;text-align:center;font-family:Arial;padding:20px}
.btn{background:#00aaff;color:#000;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold}
table{width:90%;margin:20px auto;border-collapse:collapse;background:#111}
th,td{border:1px solid #333;padding:10px}
th{background:#222;color:#00aaff}
.code{color:#ffd700;font-weight:bold;font-size:18px}
.ok{color:#00ff88}.used{color:#ff4444}
</style>
</head>
<body>
<h2>اكواد صفقات يوم {{ today }}</h2>
<a href="/admin/create_codes" class="btn">+ انشاء 3 اكواد جديدة</a>
<table>
<tr><th>#</th><th>الكود</th><th>الزوج</th><th>الاتجاه</th><th>الربح</th><th>الحالة</th></tr>
{% for code in codes %}
<tr>
<td>{{ loop.index }}</td>
<td class="code">{{ code[0] }}</td>
<td>{{ code[1] }}</td>
<td>{{ code[2] }}</td>
<td>{{ code[3] }}%</td>
<td class="{% if code[4]==1 %}used{% else %}ok{% endif %}">{% if code[4]==1 %}مستخدم{% else %}متاح{% endif %}</td>
</tr>
{% else %}
<tr><td colspan="6">مفيش اكواد. دوس انشاء</td></tr>
{% endfor %}
</table>
</body>
</html>
